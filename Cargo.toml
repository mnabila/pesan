[package]
name = "pesan"
version = "0.3.0"
edition = "2024"
license = "MIT"

# Optimize dependencies even in dev so `cargo run` isn't laggy, while keeping
# fast incremental rebuilds of the app crate itself.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Balanced size+speed release profile for a portable single binary.
[profile.release]
opt-level = "s"       # optimize for size, keeps decent speed ("z" can be larger/slower here)
lto = "thin"          # near-fat size wins, far faster to compile than fat lto
codegen-units = 1     # better cross-unit optimization / smaller binary
panic = "abort"       # drop unwinding tables/landing pads (no catch_unwind in the app)
strip = true          # strip symbols

[dependencies]
anyhow = "1.0.104"
async-imap = { version = "0.11.3", default-features = false, features = [
  "runtime-tokio",
] }
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.34"
htmd = "0.5.5"
keyring = { version = "3", features = ["sync-secret-service"] }
lettre = { version = "0.11.23", default-features = false, features = [
  "tokio1",
  "tokio1-rustls",
  "smtp-transport",
  "builder",
  "ring",
  "webpki-roots",
] }
mail-parser = "0.11"
notify-rust = "4.18.0"
oauth2 = { version = "5", features = ["reqwest", "reqwest-blocking"] }
open = "5"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
] }
tokio = { version = "1.53.1", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "sync",
  "fs",
  "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
  "logging",
] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
unicode-width = "0.2.2"
url = "2"
webpki-roots = "1"
