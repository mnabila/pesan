name: Unstable Build

on:
  push:
    branches:
      - main
  schedule:
    # Every day at midnight UTC
    - cron: "0 0 * * *"

jobs:
  check:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for commits in last 24h
        id: check
        run: |
          # Push events always run; scheduled runs only if there was a commit
          # on main within the last 24 hours.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No commits in last 24h; skipping unstable build."
          fi

  unstable:
    name: Unstable
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Prepare assets
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -n1 | cut -d'"' -f4)
          SHA=$(git rev-parse --short HEAD)
          ASSET="pesan-${VERSION}-${SHA}-linux-amd64"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          mkdir dist
          cp target/release/pesan "dist/$ASSET"

      - name: Publish unstable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: unstable
          name: Unstable Build
          prerelease: true
          files: dist/${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
